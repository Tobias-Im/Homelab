
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - /home/Saturday/docker/uptime-kuma/data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  pve-exporter:
    image: prompve/prometheus-pve-exporter
    container_name: pve-exporter
    restart: unless-stopped
    ports:
      - "9221:9221"
    volumes:
      - /home/Saturday/docker/prometheus/pve.yml:/etc/prometheus/pve.yml

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=Saturday
      - DOCKER_INFLUXDB_INIT_PASSWORD=Sunday
      - DOCKER_INFLUXDB_INIT_ORG=pve1
      - DOCKER_INFLUXDB_INIT_BUCKET=proxmox
      - DOCKER_INFLUXDB_INIT_RETENTION=4w
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=<YOUR_ADMIN_TOKEN>
    volumes:
      - docker_influxdb_data:/var/lib/influxdb2

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    ports:
      - "9090:9090"
    volumes:
      - /home/Saturday/docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - docker_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docker_grafana-data:/var/lib/grafana

volumes:
  docker_prometheus_data:
    external: true
  docker_grafana-data:
    external: true
  docker_influxdb_data:
    external: true
